; WSE2 settings for this module.
; The client copies Modules\<module>\module_config_template.ini over Documents\Mount&Blade Warband WSE2\<module>\
; module_config.ini at every start and loads it (mbCoreGame::loadConfig; with no template it deletes that file).
; A module_config.ini in the module folder is never read.
[General]
